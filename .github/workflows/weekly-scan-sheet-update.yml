name: Weekly Issues Scan Sheet Update

on:
  schedule:
    # 12:30 UTC Friday = 18:00 Asia/Colombo Friday. Deliberately Friday, not
    # Sunday: the daily reminder job runs every morning including Sunday
    # (to send Monday's reminder 24h ahead), so the upcoming week's
    # assignments must already be written into the Issues Scan sheet
    # *before* that Sunday 09:00 run — Friday evening gives 2+ days of
    # buffer, where a Sunday run would land only 9 hours ahead of it.
    - cron: "30 12 * * 5"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Test mode: print what would be written, don't touch the sheet"
        type: boolean
        default: true
      target_date:
        description: "Treat this date (YYYY-MM-DD, any day) as the Monday to start the week from — leave blank for the real upcoming week"
        type: string
        default: ""

jobs:
  update-scan-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python update_scan_sheet.py
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          SCAN_SPREADSHEET_ID: ${{ secrets.SCAN_SPREADSHEET_ID }}
          ROSTER_SPREADSHEET_ID: ${{ secrets.ROSTER_SPREADSHEET_ID }}
          LEAVE_SPREADSHEET_ID: ${{ secrets.LEAVE_SPREADSHEET_ID }}
          GMAIL_SENDER_ADDRESS: ${{ secrets.GMAIL_SENDER_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_API_REFRESH_TOKEN: ${{ secrets.GMAIL_API_REFRESH_TOKEN }}
          MS_OAUTH_CLIENT_ID: ${{ secrets.MS_OAUTH_CLIENT_ID }}
          MS_OAUTH_TENANT_ID: ${{ secrets.MS_OAUTH_TENANT_ID }}
          MS_OAUTH_REFRESH_TOKEN: ${{ secrets.MS_OAUTH_REFRESH_TOKEN }}
          # "smtp" (SMTP+app password), "gmail_api" (Gmail API OAuth), or "graph" (Microsoft Graph OAuth).
          MAIL_PROVIDER: "smtp"
          LEAD_ALERT_EMAIL: ${{ secrets.LEAD_ALERT_EMAIL }}
          ROSTER_TEAM_LABEL: ${{ secrets.ROSTER_TEAM_LABEL }}
          LEAVE_TEAM_LABEL: ${{ secrets.LEAVE_TEAM_LABEL }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
          TARGET_DATE_OVERRIDE: ${{ github.event.inputs.target_date }}
          TIMEZONE: "Asia/Colombo"
          # Tune these to match your real sheets — see README "Required Google Sheet structure".
          ROSTER_TAB_OVERRIDE: "2026 - New"
          ROSTER_DATE_COLUMN_INDEX: "1"
          ROSTER_DATE_FORMAT: "%m/%d/%Y"
          ROSTER_DUTY_CODES: "6-9am,6-9am-OC"
          ROSTER_DUTY_EXCLUDE_CODES: "6-9pm,Allo-INT"
          ROSTER_AVAILABLE_CODES: "LK"
          EMAIL_DOMAIN: "@wso2.com"
          DATE_FORMAT: "%m/%d/%Y"
          LEAVE_TAB_PREFIX: "Leave Plan "
          LEAVE_DATE_FORMAT: "%d-%b"
          SCAN_SHEET_DATE_COLUMN_INDEX: "1"
          SCAN_SHEET_DUTY_MARKER: "Scan"
          SCAN_SHEET_EXCLUDE_TAG: "Skip"
